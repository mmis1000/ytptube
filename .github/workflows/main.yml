name: build-docker-containers

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
      - testing
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"

env:
  BUILD_AMD64: ${{ vars.BUILD_AMD64 != 'false' && 'true' || 'false' }}
  GHCR_SLUG: ghcr.io/${{ github.repository }}
  BUN_VERSION: latest
  NODE_VERSION: 20
  PYTHON_VERSION: "3.13"

jobs:
  validate-build-config:
    name: Validate Build Configuration
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check if amd64 build is enabled
        run: |
          if [ "${{ vars.BUILD_AMD64 }}" = "false" ]; then
            echo "::error::BUILD_AMD64 is disabled. This workflow only publishes amd64 to GHCR."
            exit 1
          fi
          echo "Build configuration is valid"
          echo "BUILD_AMD64: ${{ vars.BUILD_AMD64 != 'false' && 'true' || 'false' }}"

  test:
    name: Run Tests & Prepare Frontend
    needs: [validate-build-config]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        run: uv sync

      - name: Run Python linting
        run: uv run ruff check app/

      - name: Run Python tests
        run: uv run pytest app/tests/ -v --tb=short

      - name: Cache bun installation
        id: cache-bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frontend dependencies
        working-directory: ui
        env:
          NODE_ENV: development
        run: bun install --frozen-lockfile

      - name: Prepare frontend (nuxt prepare)
        working-directory: ui
        env:
          NODE_ENV: development
        run: bun nuxt prepare

      - name: Run frontend linting
        working-directory: ui
        run: bun run lint

      - name: Run frontend type checking
        working-directory: ui
        run: bun run typecheck

      - name: Run frontend tsc
        working-directory: ui
        run: bun run lint:tsc

      - name: Run frontend tests
        working-directory: ui
        run: bun run test:ci

      - name: Remove dev dependencies
        working-directory: ui
        env:
          NODE_ENV: production
        run: bun install --frozen-lockfile --production --ignore-scripts

      - name: Build frontend
        working-directory: ui
        env:
          NODE_ENV: production
        run: bun run generate

      - name: Install GitPython
        run: pip install gitpython

      - name: Generate CHANGELOG.json
        run: |
          python3 .github/scripts/generate_changelog.py -p . -f ./ui/exported/CHANGELOG.json

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ui/exported/
          retention-days: 1

  docker-build-amd64:
    name: Build Container (amd64)
    runs-on: ubuntu-latest
    needs: [test, validate-build-config]
    if: vars.BUILD_AMD64 != 'false'
    permissions:
      packages: write
      contents: write
    env:
      ARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ui/exported/

      - name: Update app/library/version.py
        run: |
          VERSION="${GITHUB_REF##*/}"
          SHA=$(git rev-parse HEAD)
          DATE=$(date -u +"%Y%m%d")
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//-/g')

          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_SHA=${SHA}" >> "$GITHUB_ENV"
          echo "APP_DATE=${DATE}" >> "$GITHUB_ENV"
          echo "APP_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

          sed -i \
            -e "s/^APP_VERSION = \".*\"/APP_VERSION = \"${VERSION}\"/" \
            -e "s/^APP_COMMIT_SHA = \".*\"/APP_COMMIT_SHA = \"${SHA}\"/" \
            -e "s/^APP_BUILD_DATE = \".*\"/APP_BUILD_DATE = \"${DATE}\"/" \
            -e "s/^APP_BRANCH = \".*\"/APP_BRANCH = \"${BRANCH}\"/" \
            app/library/version.py

          echo "Updated version info:"
          cat app/library/version.py

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ env.GHCR_SLUG }}
          flavor: |
            latest=false
            suffix=-${{ env.ARCH }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ env.ARCH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}
          cache-from: type=gha,scope=${{ github.workflow }}
          provenance: true

